name: Build and prerelease plugin

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
            shell: bash
          - platform: win32-x64
            os: windows-2022
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare native Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build audited native FFmpeg
        run: |
          set -euo pipefail
          build_temp="$(mktemp -d)"
          source_archive="$build_temp/ffmpeg-n6.1.1.tar.gz"
          curl --fail --location --retry 3 --output "$source_archive" \
            https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/n6.1.1
          python3 - "$source_archive" <<'PY'
          import hashlib, sys
          from pathlib import Path
          expected = '7c1ebea95d815e49c1e60c7ee816410dec73a81b8ac002b276780d2f9048e598'
          if hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest() != expected:
              raise SystemExit('Official FFmpeg source archive SHA-256 mismatch')
          PY
          tar -xzf "$source_archive" -C "$build_temp"
          zlib_archive=''
          if test "${{ matrix.platform }}" = win32-x64; then
            zlib_archive="$build_temp/zlib-1.3.2.tar.xz"
            curl --fail --location --retry 3 --output "$zlib_archive" \
              https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz
          fi
          sh scripts/build-ffmpeg.sh "$build_temp/FFmpeg-n6.1.1" \
            "$PWD/bin/${{ matrix.platform }}" "$source_archive" "$zlib_archive"
          tar -czf "ffmpeg-${{ matrix.platform }}.tar.gz" "bin/${{ matrix.platform }}"
      - name: Preserve native binary, license and source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ffmpeg-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(manifest.version) || pkg.version !== manifest.version) {
            throw new Error('Package and manifest versions must be matching semantic versions');
          }
          if (manifest.minHostVersion !== '0.30.0' || JSON.stringify(manifest.platforms) !== '["darwin-arm64","win32-x64"]') {
            throw new Error('This release requires desktop-pet 0.30.0 and both native release platforms');
          }
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== 'v' + manifest.version) {
            throw new Error('Tag and manifest versions differ');
          }
          JS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ffmpeg-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-artifacts
          merge-multiple: true
      - name: Assemble one complete install ZIP
        run: |
          set -euo pipefail
          tar -xzf native-artifacts/ffmpeg-darwin-arm64.tar.gz
          tar -xzf native-artifacts/ffmpeg-win32-x64.tar.gz
          npm ci --ignore-scripts
          npm run build
          python3 scripts/verify-release.py --write-receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bili-universal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/release.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-verify:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: win32-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHON: python
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bili-universal-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Install locked test dependencies
        run: npm ci
      - name: Verify the exact ZIP and prepare native tests
        run: |
          set -euo pipefail
          python scripts/verify-release.py --extract "$RUNNER_TEMP/bili-release" --install-test-binaries
          echo "BILI_RELEASE_DIR=$RUNNER_TEMP/bili-release" >> "$GITHUB_ENV"
      - name: Run plugin tests on native operating system
        run: npm test
      - name: Run installed release download, extraction and chat tests
        run: npm run test:release:native
      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bili-native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-native-*.json
          if-no-files-found: error
          retention-days: 14

  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bili-universal-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish immutable testing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.zip.sha256)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/release.json \
            --verify-tag --target "$GITHUB_SHA" --title "B 站生活 $GITHUB_REF_NAME (testing)" \
            --notes-file dist/RELEASE_NOTES.md --prerelease --latest=false
